name: 反馈网站问题
description: 搜索、筛选、收藏、复习或页面显示出现问题
title: "[网站问题] "
body:
  - type: textarea
    id: page
    attributes:
      label: 出问题的页面链接
      description: 请复制出问题时地址栏里的完整链接，搜索词和筛选条件请一起保留。
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 发生了什么问题？
      description: 请说说你做了什么、原本希望怎样，以及实际发生了什么。
      placeholder: |
        我做了什么：

        原本希望：

        实际发生：
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 设备和浏览器（可选）
      description: 比如“iPhone + Safari”或“电脑 + Chrome”。收藏或复习问题也可说明刷新后记录是否还在、是否换过浏览器或清理过网站数据。

  - type: textarea
    id: details
    attributes:
      label: 补充信息（可选）
      description: 可以补充截图或页面上的提示文字。
