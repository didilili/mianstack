name: 网站问题与建议
description: 使用遇到了问题，或希望某项功能更方便。
title: "[网站反馈] "
body:
  - type: markdown
    attributes:
      value: |
        搜索、筛选、收藏、复习、页面显示等使用问题，以及功能建议，都可以在这里提出。不必先判断是不是 Bug。
        题目、答案或面经内容有误，请使用[内容纠错与补充](https://github.com/didilili/mianstack/issues/new?template=01-content-feedback.yml)。

  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么问题，或有什么建议？
      description: 说明操作过程、实际结果，或你希望改进的地方。
    validations:
      required: true

  - type: textarea
    id: page
    attributes:
      label: 相关页面（可选）
      description: 贴相关页面链接；搜索或筛选问题请保留当时的条件。

  - type: textarea
    id: environment
    attributes:
      label: 设备和浏览器（可选）
      description: 例如 iPhone + Safari、Windows + Chrome。

  - type: textarea
    id: details
    attributes:
      label: 截图或其他补充（可选）
      description: 附上截图或页面提示文字。
