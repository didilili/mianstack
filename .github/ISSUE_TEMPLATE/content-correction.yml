name: 内容纠错
description: 报告题目、答案、分类、来源或链接中的问题
title: "[内容纠错] "
body:
  - type: dropdown
    id: content_type
    attributes:
      label: 内容类型
      options:
        - 面试题或参考答案
        - 面经或题目出处
        - 分类、相近题或索引
        - 文档或链接
        - 其他
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: 题号、面经编号或文件路径
      description: 例如 Q-0001、MJ-NC-2026-0001 或 README.md。
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 发现的问题
      description: 请说明当前内容哪里不准确、过时、重复或无法访问。
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: 建议修改
      description: 如果已有明确修改方案，请写出建议表述或处理方式。

  - type: textarea
    id: sources
    attributes:
      label: 核对依据
      description: 涉及技术事实或题目出处时，请提供可靠资料或原始链接。

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我没有在公开 Issue 中提交私密资料或个人敏感信息。
          required: true
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
