name: 分享面经或题集
description: 贴一个值得收录的链接，或写下自己的面试经历。
title: "[内容分享] "
body:
  - type: markdown
    attributes:
      value: |
        面经、题单、题集或开源题库都欢迎。已有公开原帖，贴链接即可，不必再抄正文；没有链接，也可以直接写自己的面试经历。

  - type: textarea
    id: details
    attributes:
      label: 链接或内容
      description: 贴原始链接，或写下面试问题。公司、岗位、时间、轮次等信息可一起补充。
      placeholder: |
        面经、题集或仓库链接：
        或者直接写面试经历：
        公司／岗位：
        面试问题与追问：
        1.
        2.
    validations:
      required: true

  - type: textarea
    id: attribution
    attributes:
      label: 署名或来源说明（可选）
      description: 本人投稿可说明希望使用的站内署名；推荐他人的内容时，请补充原作者和出处。
