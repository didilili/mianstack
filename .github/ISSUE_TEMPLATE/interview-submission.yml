name: 新增面经
description: 分享自己的面试经历，或提供牛客、小红书等公开面经链接
title: "[新增面经] "
body:
  - type: textarea
    id: details
    attributes:
      label: 面经内容或原帖链接
      description: 本人投稿可参考下面的格式；推荐已有公开面经时，直接提供原帖链接即可。不清楚的信息可以留空，涉及个人隐私的内容请先隐去。
      placeholder: |
        公司名称：
        业务方向：
        面试时间：
        招聘类型：社招 / 校招 等
        岗位类型：实习 / 全职 等
        岗位名称：
        面试轮次：一面 / 二面 / 终面 等
        面试结果：
        面试问题与追问（尽量保留原问和必要上下文）：
        1.
        2.
        3.

        或直接粘贴面经原帖链接（牛客、小红书等）：
    validations:
      required: true

  - type: textarea
    id: attribution
    attributes:
      label: 来源与署名说明（可选）
      description: 本人投稿可说明希望使用的署名；推荐他人的面经时，可补充原作者和出处。请区分原文与你补充的回答。
