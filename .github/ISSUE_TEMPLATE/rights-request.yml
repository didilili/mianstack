name: 署名、展示范围或移除请求
description: 供原作者或权利人反馈题目、答案、面经、题集及网站内容的来源、署名或展示问题
title: "[权利反馈] "
body:
  - type: markdown
    attributes:
      value: 提供内容链接和具体请求即可。

  - type: input
    id: location
    attributes:
      label: 相关内容链接或编号
      description: 可提供面栈页面或 GitHub 文件链接，也可填写题号、面经或题集编号；涉及局部内容时，请指出具体段落或条目。
    validations:
      required: true

  - type: input
    id: original_source
    attributes:
      label: 原始来源链接
      description: 如果方便，请提供原帖或作者主页链接；原帖已删除或无法访问时可留空。

  - type: dropdown
    id: request_type
    attributes:
      label: 请求类型
      options:
        - 补充或更正署名
        - 更正来源链接
        - 限制展示范围
        - 移除相关内容
        - 其他权利问题
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: 具体请求
      description: 请说明需要更正的署名或来源、限制展示的范围，或希望移除的内容，并补充必要的背景信息。
    validations:
      required: true
