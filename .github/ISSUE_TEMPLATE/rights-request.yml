name: 署名、展示范围或移除请求
description: 供原作者或权利人反馈第三方材料的署名与展示问题
title: "[权利反馈] "
body:
  - type: markdown
    attributes:
      value: 提供内容链接和具体请求即可。

  - type: input
    id: location
    attributes:
      label: 涉及的文件、题号或面经编号
    validations:
      required: true

  - type: input
    id: original_source
    attributes:
      label: 原始来源链接
      description: 如果原始页面仍可访问，请提供链接。

  - type: dropdown
    id: request_type
    attributes:
      label: 请求类型
      options:
        - 补充或更正署名
        - 更正来源链接
        - 限制展示范围
        - 移除相关内容
        - 其他权利问题
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: 具体请求
      description: 请说明希望如何处理以及必要的背景信息。
    validations:
      required: true
