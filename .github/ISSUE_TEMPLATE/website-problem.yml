name: 网站使用问题
description: 反馈搜索、筛选、收藏、复习、页面显示等使用问题
title: "[网站问题] "
body:
  - type: textarea
    id: page
    attributes:
      label: 出问题的页面链接
      description: 请复制出问题时地址栏中的完整 URL，保留搜索词、筛选条件等参数。
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 请说明操作过程和看到的结果，方便维护者复现。
      placeholder: |
        操作步骤：
        1.
        2.

        预期结果：

        实际结果：
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 设备和浏览器（可选）
      description: 可说明使用手机还是电脑，以及浏览器名称。收藏或复习问题可补充刷新后记录是否仍在、是否换过浏览器或清理过数据，以及有无保存失败提示。

  - type: textarea
    id: details
    attributes:
      label: 补充信息（可选）
      description: 可以补充截图或页面上的提示文字。
