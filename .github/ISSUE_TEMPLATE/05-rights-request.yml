name: 署名或移除请求
description: 更正来源、调整署名或移除内容。
title: "[权利反馈] "
body:
  - type: markdown
    attributes:
      value: |
        提供内容链接和希望的处理方式即可。

  - type: input
    id: location
    attributes:
      label: 相关内容链接
      description: 贴页面或文件链接，也可以填写题号、面经或题集编号。
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: 希望如何处理？
      description: 说明需要更正的来源或署名，或要调整、移除的内容。
    validations:
      required: true

  - type: input
    id: original_source
    attributes:
      label: 原帖或作者主页（可选）
      description: 附上原帖或作者主页链接。
