name: 批量内容或结构调整
description: 提议批量导入、分类调整、字段变更或其他影响范围较大的修改
title: "[结构提议] "
body:
  - type: dropdown
    id: change_type
    attributes:
      label: 变更类型
      options:
        - 批量新增或导入内容
        - 调整分类或专题
        - 修改字段或引用关系
        - 调整编号、合并或删除策略
        - 其他结构性变更
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 目标与范围
      description: 说明要解决的问题、影响范围和预计涉及的内容数量；如有相关 Issue，请附链接。
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: 数据来源与收录范围
      description: 请提供原始链接，并说明计划收录的内容和署名方式。

  - type: textarea
    id: migration
    attributes:
      label: 兼容与迁移方案
      description: 说明现有编号、引用和索引如何衔接，以及对网站展示的影响。
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 验证方式
      description: 说明如何检查内容、索引和受影响的网站页面。
    validations:
      required: true
