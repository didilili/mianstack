name: 批量内容或结构调整
description: 提议批量导入、分类调整、字段变更或其他影响范围较大的修改
title: "[结构提议] "
body:
  - type: dropdown
    id: change_type
    attributes:
      label: 变更类型
      options:
        - 批量新增或导入内容
        - 调整分类或专题
        - 修改字段或引用关系
        - 调整编号、合并或删除策略
        - 其他结构性变更
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 目标与范围
      description: 说明要解决的问题、预计影响的目录或记录数量，以及明确不包含的范围。
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: 数据来源与收录范围
      description: 批量内容请说明原始来源、获取方式、署名方式和计划收录的字段；受限页面只记录当前可核验的信息。

  - type: textarea
    id: migration
    attributes:
      label: 兼容与迁移方案
      description: 说明如何处理现有 ID、别名、引用、生成索引和下游读取方。
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 验证方式
      description: 说明准备增加或运行哪些检查，如何确认变更没有破坏现有内容。
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，并确认这不是已有提议的重复内容。
          required: true
        - label: 我不会在公开 Issue 中直接粘贴私密材料或个人敏感信息。
          required: true
