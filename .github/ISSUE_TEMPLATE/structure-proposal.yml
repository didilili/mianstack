name: 题集推荐与结构提议
description: 推荐公开面试题集，或讨论批量收录、分类、编号及字段等调整；单篇内容纠错请选“内容反馈与改进”
title: "[结构提议] "
body:
  - type: dropdown
    id: change_type
    attributes:
      label: 变更类型
      options:
        - 推荐公开面试题集
        - 批量新增或导入内容
        - 调整分类或专题
        - 修改字段或引用关系
        - 调整编号、合并或删除策略
        - 其他结构性变更
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 目标与范围
      description: 推荐题集时，简述内容方向和推荐理由；提出调整时，说明要解决的问题及涉及的内容或页面，无需先给出完整方案。
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: 来源与收录范围（可选）
      description: 推荐题集或批量内容时，请提供原始页面或仓库链接、发布者，以及希望收录的部分；无需复制第三方答案或完整正文。

  - type: textarea
    id: migration
    attributes:
      label: 兼容与检查思路（可选）
      description: 如果已有想法，可说明编号、引用和网站展示如何衔接，以及怎样检查结果；推荐题集时可留空。
