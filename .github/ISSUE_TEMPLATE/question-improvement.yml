name: 题目优化
description: 修正现有题目、分类或技术错误，补充和改进参考答案
title: "[题目优化] "
body:
  - type: input
    id: question
    attributes:
      label: 题号或题目链接
      description: 例如 Q-0001，或题目在 GitHub、面栈网站上的链接。
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: 优化建议
      description: 请说明哪里需要改进，以及建议的修改或答案内容。
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: 参考资料（可选）
      description: 涉及技术事实或题目出处时，请提供可靠资料或原始链接。
