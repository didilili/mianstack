<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000" role="img"><title>tcp-window-space</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#738194"/></marker></defs><rect width="720" height="1000" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="60" font-size="38" fill="#172033" font-weight="700" text-anchor="start">TCP：还能新发多少字节？</text><text x="32" y="104" font-size="28" fill="#566477" font-weight="400" text-anchor="start">窗口上限与已发未确认量要分开</text><rect x="24" y="135" width="672" height="180" rx="16" fill="#f5f7fb" stroke="#dbe2ea"/><text x="46" y="181" font-size="30" fill="#172033" font-weight="400" text-anchor="start">接收窗口 rwnd = 4000 B</text><text x="46" y="225" font-size="30" fill="#172033" font-weight="400" text-anchor="start">拥塞窗口 cwnd = 2000 B</text><text x="46" y="276" font-size="28" fill="#1469b6" font-weight="600" text-anchor="start">在途上限 = min(rwnd, cwnd) = 2000 B</text><text x="32" y="365" font-size="32" fill="#172033" font-weight="700" text-anchor="start">① ACK 到达前</text><text x="32" y="410" font-size="28" fill="#172033" font-weight="400" text-anchor="start">1500 B 在途，剩余 500 B 可新发</text><rect x="32" y="442" width="656" height="72" rx="16" fill="#fff1e7" stroke="#dbe2ea"/><rect x="32" y="442" width="492" height="72" rx="0" fill="#f8a66d" stroke="#f8a66d"/><rect x="524" y="442" width="164" height="72" rx="0" fill="#c7e8d6" stroke="#c7e8d6"/><text x="278" y="488" font-size="28" fill="#172033" font-weight="400" text-anchor="middle">已发未确认</text><text x="606" y="488" font-size="25" fill="#172033" font-weight="400" text-anchor="middle">可新发</text><text x="32" y="550" font-size="24" fill="#566477" font-weight="400" text-anchor="start">0</text><text x="524" y="550" font-size="24" fill="#566477" font-weight="400" text-anchor="middle">1500</text><text x="688" y="550" font-size="24" fill="#566477" font-weight="400" text-anchor="end">2000 B</text><path d="M360,580 L360,628" stroke="#738194" stroke-width="3" marker-end="url(#a)"/><text x="32" y="674" font-size="32" fill="#172033" font-weight="700" text-anchor="start">② 确认其中 500 B 后</text><text x="32" y="718" font-size="28" fill="#172033" font-weight="400" text-anchor="start">1000 B 在途，剩余 1000 B 可新发</text><rect x="32" y="750" width="328" height="72" rx="0" fill="#f8a66d" stroke="#f8a66d"/><rect x="360" y="750" width="328" height="72" rx="0" fill="#c7e8d6" stroke="#c7e8d6"/><text x="196" y="796" font-size="28" fill="#172033" font-weight="400" text-anchor="middle">已发未确认</text><text x="524" y="796" font-size="28" fill="#172033" font-weight="400" text-anchor="middle">可新发</text><text x="32" y="875" font-size="27" fill="#566477" font-weight="400" text-anchor="start">假设期间未发送新数据，窗口上限不变。</text><text x="32" y="918" font-size="27" fill="#1469b6" font-weight="600" text-anchor="start">ACK 推进确认位置，不等于窗口大小。</text><text x="32" y="962" font-size="27" fill="#566477" font-weight="400" text-anchor="start">两个传输方向各自维护窗口。</text></g></svg>