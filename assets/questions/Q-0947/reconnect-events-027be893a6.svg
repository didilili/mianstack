<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1510" viewBox="0 0 720 1510" role="img"><title>同一任务断线后的事件补发与实时接续</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1469b6"/></marker></defs><rect width="720" height="1510" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="54" font-size="36" fill="#172033" font-weight="700" text-anchor="start">断线重连：接续同一任务的事件</text><text x="30" y="96" font-size="27" fill="#566477" font-weight="400" text-anchor="start">先保存事件，再按已处理游标补发</text><rect x="6" y="125" width="148" height="92" rx="12" fill="#f5f7fb" stroke="#dbe2ea"/><text x="80" y="162" font-size="27" fill="#172033" font-weight="600" text-anchor="middle">客户端</text><path d="M80,225 V1255" fill="none" stroke="#c2ccd8" stroke-width="2" stroke-dasharray="8 8"/><rect x="186" y="125" width="148" height="92" rx="12" fill="#f5f7fb" stroke="#dbe2ea"/><text x="260" y="162" font-size="27" fill="#172033" font-weight="600" text-anchor="middle">推送层</text><path d="M260,225 V1255" fill="none" stroke="#c2ccd8" stroke-width="2" stroke-dasharray="8 8"/><rect x="366" y="125" width="148" height="92" rx="12" fill="#f5f7fb" stroke="#dbe2ea"/><text x="440" y="162" font-size="27" fill="#172033" font-weight="600" text-anchor="middle">持久</text><text x="440" y="199" font-size="27" fill="#172033" font-weight="600" text-anchor="middle">事件流</text><path d="M440,225 V1255" fill="none" stroke="#c2ccd8" stroke-width="2" stroke-dasharray="8 8"/><rect x="546" y="125" width="148" height="92" rx="12" fill="#f5f7fb" stroke="#dbe2ea"/><text x="620" y="162" font-size="27" fill="#172033" font-weight="600" text-anchor="middle">执行器</text><path d="M620,225 V1255" fill="none" stroke="#c2ccd8" stroke-width="2" stroke-dasharray="8 8"/><rect x="432" y="238" width="196" height="43" rx="12" fill="white" stroke="#dbe2ea"/><text x="530.0" y="268" font-size="25" fill="#1469b6" font-weight="600" text-anchor="middle">追加 41</text><path d="M620,280 H440" fill="none" stroke="#1469b6" stroke-width="3" marker-end="url(#a)"/><rect x="252" y="323" width="196" height="43" rx="12" fill="white" stroke="#dbe2ea"/><text x="350.0" y="353" font-size="25" fill="#1469b6" font-weight="600" text-anchor="middle">读取 41</text><path d="M440,365 H260" fill="none" stroke="#1469b6" stroke-width="3" marker-end="url(#a)"/><rect x="72" y="408" width="196" height="43" rx="12" fill="white" stroke="#dbe2ea"/><text x="170.0" y="438" font-size="25" fill="#1469b6" font-weight="600" text-anchor="middle">推送 41</text><path d="M260,450 H80" fill="none" stroke="#1469b6" stroke-width="3" marker-end="url(#a)"/><rect x="24" y="480" width="672" height="62" rx="12" fill="#eaf6ef" stroke="#dbe2ea"/><text x="360" y="520" font-size="27" fill="#187650" font-weight="600" text-anchor="middle">客户端成功应用后，保存游标 41</text><rect x="24" y="575" width="672" height="65" rx="12" fill="#fff1e7" stroke="#dbe2ea"/><text x="360" y="616" font-size="29" fill="#c54d0b" font-weight="600" text-anchor="middle">连接中断 · 后台任务仍继续</text><rect x="432" y="668" width="196" height="43" rx="12" fill="white" stroke="#dbe2ea"/><text x="530.0" y="698" font-size="25" fill="#1469b6" font-weight="600" text-anchor="middle">追加 42、43</text><path d="M620,710 H440" fill="none" stroke="#1469b6" stroke-width="3" marker-end="url(#a)"/><rect x="72" y="763" width="196" height="43" rx="12" fill="white" stroke="#dbe2ea"/><text x="170.0" y="793" font-size="25" fill="#1469b6" font-weight="600" text-anchor="middle">携游标 41 重连</text><path d="M80,805 H260" fill="none" stroke="#1469b6" stroke-width="3" marker-end="url(#a)"/><rect x="166" y="837" width="522" height="65" rx="12" fill="#f5f7fb" stroke="#dbe2ea"/><text x="427" y="878" font-size="26" fill="#172033" font-weight="600" text-anchor="middle">推送层先校验任务访问权限</text><rect x="252" y="921" width="196" height="43" rx="12" fill="white" stroke="#dbe2ea"/><text x="350.0" y="951" font-size="25" fill="#1469b6" font-weight="600" text-anchor="middle">读取 41 之后</text><path d="M260,963 H440" fill="none" stroke="#1469b6" stroke-width="3" marker-end="url(#a)"/><rect x="252" y="1020" width="196" height="43" rx="12" fill="white" stroke="#dbe2ea"/><text x="350.0" y="1050" font-size="25" fill="#1469b6" font-weight="600" text-anchor="middle">42、43 及后续</text><path d="M440,1062 H260" fill="none" stroke="#1469b6" stroke-width="3" marker-end="url(#a)"/><rect x="72" y="1119" width="196" height="43" rx="12" fill="white" stroke="#dbe2ea"/><text x="170.0" y="1149" font-size="25" fill="#1469b6" font-weight="600" text-anchor="middle">补发后持续推送</text><path d="M260,1161 H80" fill="none" stroke="#1469b6" stroke-width="3" marker-end="url(#a)"/><rect x="24" y="1270" width="672" height="114" rx="12" fill="#eaf6ef" stroke="#dbe2ea"/><text x="360" y="1313" font-size="27" fill="#187650" font-weight="600" text-anchor="middle">客户端按事件 ID 去重、按序应用</text><text x="360" y="1356" font-size="26" fill="#187650" font-weight="400" text-anchor="middle">历史读取与实时流需可靠衔接</text><text x="30" y="1432" font-size="28" fill="#172033" font-weight="600" text-anchor="start">本图只恢复事件可见性。</text><text x="30" y="1477" font-size="26" fill="#566477" font-weight="400" text-anchor="start">执行器若崩溃，另用任务检查点恢复计算。</text></g></svg>