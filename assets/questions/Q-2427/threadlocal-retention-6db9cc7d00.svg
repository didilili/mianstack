<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1330" viewBox="0 0 390 1330" role="img" aria-labelledby="title desc">
  <title id="title">ThreadLocal：弱键清除后，值仍可能被强引用保留</title>
  <desc id="desc">存活的长寿命线程经ThreadLocalMap和Entry强引用value。初始Entry弱引用ThreadLocal键，另有外部强引用持有键。外部强引用消失，键不再强或软可达且GC处理相应弱引用后，可出现key=null，但线程到value的强引用链仍存在。请求结束应主动remove；失效条目的机会性清理与最终GC回收不保证即时。</desc>
  <defs>
    <marker id="strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#176b99" />
    </marker>
    <marker id="weak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8952a3" />
    </marker>
  </defs>
  <style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
  <rect x="0" y="0" width="390" height="1330" rx="0" fill="#f8fafb" stroke="none" />
  <text x="24" y="37" font-size="21" fill="#173042" font-weight="600" text-anchor="start">ThreadLocal：弱键不等于弱值</text>
  <text x="24" y="65" font-size="15" fill="#536877" font-weight="400" text-anchor="start">沿着存活线程，追踪值的强引用路径</text>
  <rect x="16" y="88" width="358" height="465" rx="12" fill="#fff" stroke="none" />
  <text x="30" y="122" font-size="18" fill="#173042" font-weight="600" text-anchor="start">① 外部仍强引用 ThreadLocal 键</text>
  <rect x="35" y="160" width="160" height="54" rx="9" fill="#e7f2f8" stroke="none" />
  <text x="115.0" y="182" font-size="17" fill="#176b99" font-weight="600" text-anchor="middle">长寿命线程</text>
  <text x="115.0" y="201" font-size="14" fill="#176b99" font-weight="400" text-anchor="middle">仍存活</text>
  <rect x="35" y="253" width="160" height="46" rx="9" fill="#e7f2f8" stroke="none" />
  <text x="115.0" y="282.0" font-size="17" fill="#176b99" font-weight="600" text-anchor="middle">ThreadLocalMap</text>
  <rect x="35" y="338" width="160" height="54" rx="9" fill="#e7f2f8" stroke="none" />
  <text x="115.0" y="360" font-size="17" fill="#176b99" font-weight="600" text-anchor="middle">Entry</text>
  <text x="115.0" y="379" font-size="14" fill="#176b99" font-weight="400" text-anchor="middle">键见右侧弱引用</text>
  <rect x="35" y="430" width="160" height="54" rx="9" fill="#fff0de" stroke="none" />
  <text x="115.0" y="452" font-size="17" fill="#a75a16" font-weight="600" text-anchor="middle">value</text>
  <text x="115.0" y="471" font-size="14" fill="#a75a16" font-weight="400" text-anchor="middle">仍被 Entry 持有</text>
  <line x1="115" y1="216" x2="115" y2="250" stroke="#176b99" stroke-width="2.2" marker-end="url(#strong)" data-phase="before" data-source="Thread" data-target="ThreadLocalMap" data-reference="strong" />
  <text x="134" y="238.5" font-size="15" fill="#176b99" font-weight="600" text-anchor="start">强</text>
  <line x1="115" y1="301" x2="115" y2="335" stroke="#176b99" stroke-width="2.2" marker-end="url(#strong)" data-phase="before" data-source="ThreadLocalMap" data-target="Entry" data-reference="strong" />
  <text x="134" y="323.5" font-size="15" fill="#176b99" font-weight="600" text-anchor="start">强</text>
  <line x1="115" y1="394" x2="115" y2="427" stroke="#176b99" stroke-width="2.2" marker-end="url(#strong)" data-phase="before" data-source="Entry" data-target="value" data-reference="strong" />
  <text x="134" y="416.0" font-size="15" fill="#176b99" font-weight="600" text-anchor="start">强</text>
  <rect x="242" y="183" width="120" height="44" rx="9" fill="#eef3f6" stroke="none" />
  <text x="302.0" y="211.0" font-size="17" fill="#173042" font-weight="600" text-anchor="middle">外部强引用</text>
  <rect x="250" y="338" width="110" height="54" rx="9" fill="#f2eaf8" stroke="none" />
  <text x="305.0" y="360" font-size="17" fill="#8952a3" font-weight="600" text-anchor="middle">ThreadLocal</text>
  <text x="305.0" y="379" font-size="14" fill="#8952a3" font-weight="400" text-anchor="middle">键对象</text>
  <line x1="302" y1="229" x2="302" y2="335" stroke="#176b99" stroke-width="2.2" marker-end="url(#strong)" data-phase="before" data-source="External" data-target="ThreadLocal" data-reference="strong" />
  <text x="322" y="284" font-size="15" fill="#176b99" font-weight="600" text-anchor="start">强</text>
  <line x1="197" y1="365" x2="247" y2="365" stroke="#8952a3" stroke-width="2.2" marker-end="url(#weak)" stroke-dasharray="6 5" data-phase="before" data-source="Entry" data-target="ThreadLocal" data-reference="weak" />
  <text x="222" y="350" font-size="15" fill="#8952a3" font-weight="600" text-anchor="middle">弱</text>
  <line x1="35" y1="515" x2="85" y2="515" stroke="#176b99" stroke-width="2.2" marker-end="url(#strong)" />
  <text x="95" y="521" font-size="15" fill="#176b99" font-weight="400" text-anchor="start">强引用</text>
  <line x1="207" y1="515" x2="247" y2="515" stroke="#8952a3" stroke-width="2.2" marker-end="url(#weak)" stroke-dasharray="6 5" />
  <text x="257" y="521" font-size="15" fill="#8952a3" font-weight="400" text-anchor="start">弱引用</text>
  <text x="30" y="544" font-size="14" fill="#536877" font-weight="400" text-anchor="start">Map → Entry 省略了中间的 table 数组</text>
  <rect x="16" y="573" width="358" height="465" rx="12" fill="#fff" stroke="none" />
  <text x="30" y="607" font-size="18" fill="#173042" font-weight="600" text-anchor="start">② 一种可能的 GC 后状态</text>
  <text x="30" y="634" font-size="15" fill="#536877" font-weight="400" text-anchor="start">前提：键不再强 / 软可达</text>
  <text x="30" y="657" font-size="15" fill="#536877" font-weight="400" text-anchor="start">并且 GC 已处理相应弱引用</text>
  <rect x="35" y="675" width="160" height="54" rx="9" fill="#e7f2f8" stroke="none" />
  <text x="115.0" y="697" font-size="17" fill="#176b99" font-weight="600" text-anchor="middle">长寿命线程</text>
  <text x="115.0" y="716" font-size="14" fill="#176b99" font-weight="400" text-anchor="middle">仍存活</text>
  <rect x="35" y="768" width="160" height="46" rx="9" fill="#e7f2f8" stroke="none" />
  <text x="115.0" y="797.0" font-size="17" fill="#176b99" font-weight="600" text-anchor="middle">ThreadLocalMap</text>
  <rect x="35" y="853" width="160" height="54" rx="9" fill="#e7f2f8" stroke="none" />
  <text x="115.0" y="875" font-size="17" fill="#176b99" font-weight="600" text-anchor="middle">Entry</text>
  <text x="115.0" y="894" font-size="14" fill="#176b99" font-weight="400" text-anchor="middle">key=null</text>
  <rect x="35" y="945" width="160" height="54" rx="9" fill="#fff0de" stroke="none" />
  <text x="115.0" y="967" font-size="17" fill="#a75a16" font-weight="600" text-anchor="middle">value</text>
  <text x="115.0" y="986" font-size="14" fill="#a75a16" font-weight="400" text-anchor="middle">仍被 Entry 持有</text>
  <line x1="115" y1="731" x2="115" y2="765" stroke="#176b99" stroke-width="2.2" marker-end="url(#strong)" data-phase="after" data-source="Thread" data-target="ThreadLocalMap" data-reference="strong" />
  <text x="134" y="753.5" font-size="15" fill="#176b99" font-weight="600" text-anchor="start">强</text>
  <line x1="115" y1="816" x2="115" y2="850" stroke="#176b99" stroke-width="2.2" marker-end="url(#strong)" data-phase="after" data-source="ThreadLocalMap" data-target="Entry" data-reference="strong" />
  <text x="134" y="838.5" font-size="15" fill="#176b99" font-weight="600" text-anchor="start">强</text>
  <line x1="115" y1="909" x2="115" y2="942" stroke="#176b99" stroke-width="2.2" marker-end="url(#strong)" data-phase="after" data-source="Entry" data-target="value" data-reference="strong" />
  <text x="134" y="931.0" font-size="15" fill="#176b99" font-weight="600" text-anchor="start">强</text>
  <line x1="197" y1="880" x2="224" y2="880" stroke="#8952a3" stroke-width="2.2" stroke-dasharray="6 5" />
  <text x="232" y="887" font-size="22" fill="#8952a3" font-weight="600" text-anchor="middle">×</text>
  <text x="251" y="875" font-size="17" fill="#8952a3" font-weight="600" text-anchor="start">key=null</text>
  <text x="251" y="900" font-size="14" fill="#8952a3" font-weight="400" text-anchor="start">弱引用已清除</text>
  <text x="30" y="1024" font-size="16" fill="#a75a16" font-weight="600" text-anchor="start">线程到 value 的强引用链仍然存在</text>
  <rect x="16" y="1054" width="358" height="257" rx="12" fill="#fff" stroke="none" />
  <text x="30" y="1088" font-size="18" fill="#173042" font-weight="600" text-anchor="start">③ 主动清理与回收的边界</text>
  <text x="30" y="1121" font-size="17" fill="#173042" font-weight="600" text-anchor="start">仍持有 tl 时：</text>
  <text x="30" y="1149" font-size="16" fill="#173042" font-weight="400" text-anchor="start">请求结束在 finally 中 tl.remove()</text>
  <text x="30" y="1175" font-size="15" fill="#536877" font-weight="400" text-anchor="start">移除对应映射，解除这条值引用链</text>
  <text x="30" y="1208" font-size="17" fill="#173042" font-weight="600" text-anchor="start">弱键失效后：</text>
  <text x="30" y="1236" font-size="15" fill="#536877" font-weight="400" text-anchor="start">后续映射操作可能清理，不保证及时</text>
  <text x="30" y="1270" font-size="16" fill="#a75a16" font-weight="600" text-anchor="start">解除本链引用 ≠ value 立即回收</text>
  <text x="30" y="1296" font-size="14" fill="#536877" font-weight="400" text-anchor="start">其他强引用仍可能保留 value</text>
</svg>