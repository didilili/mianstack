<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1202" viewBox="0 0 720 1202" role="img"><title>covering-index-icp</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#738194"/></marker></defs><rect width="720" height="1202" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="60" font-size="40" fill="#172033" font-weight="700" text-anchor="start">覆盖索引与 ICP</text><text x="32" y="103" font-size="28" fill="#566477" font-weight="400" text-anchor="start">一个避免回表，一个减少回表</text><rect x="24" y="129" width="672" height="108" rx="16" fill="#f5f7fb" stroke="#dbe2ea"/><text x="45" y="172" font-size="29" fill="#172033" font-weight="400" text-anchor="start">共同前提：二级索引（邮编，姓名）</text><text x="45" y="214" font-size="27" fill="#566477" font-weight="400" text-anchor="start">InnoDB 二级索引项还包含主键 ID</text><rect x="24" y="265" width="672" height="258" rx="16" fill="#f5f7fb" stroke="#dbe2ea"/><text x="44" y="308" font-size="31" fill="#187650" font-weight="700" text-anchor="start">① 覆盖查询</text><text x="44" y="347" font-size="27" fill="#566477" font-weight="400" text-anchor="start">只返回邮编、姓名和主键 ID</text><rect x="62" y="369" width="596" height="52" rx="16" fill="white" stroke="#dbe2ea"/><text x="360" y="405" font-size="27" fill="#172033" font-weight="400" text-anchor="middle">读取索引项</text><path d="M360,424 L360,450" stroke="#738194" stroke-width="3" marker-end="url(#a)"/><text x="360" y="491" font-size="27" fill="#187650" font-weight="600" text-anchor="middle">直接返回所需列：通常无需回表</text><rect x="24" y="547" width="672" height="258" rx="16" fill="#f5f7fb" stroke="#dbe2ea"/><text x="44" y="590" font-size="31" fill="#1469b6" font-weight="700" text-anchor="start">② 需要地址，启用 ICP</text><text x="44" y="629" font-size="27" fill="#566477" font-weight="400" text-anchor="start">按邮编定位，再检查姓名条件</text><rect x="62" y="651" width="596" height="52" rx="16" fill="white" stroke="#dbe2ea"/><text x="360" y="687" font-size="27" fill="#172033" font-weight="400" text-anchor="middle">索引中先筛选姓名</text><path d="M360,706 L360,732" stroke="#738194" stroke-width="3" marker-end="url(#a)"/><text x="360" y="773" font-size="27" fill="#1469b6" font-weight="600" text-anchor="middle">通过项再回表，读取地址</text><rect x="24" y="829" width="672" height="258" rx="16" fill="#f5f7fb" stroke="#dbe2ea"/><text x="44" y="872" font-size="31" fill="#e95509" font-weight="700" text-anchor="start">③ 同一查询，未使用 ICP</text><text x="44" y="911" font-size="27" fill="#566477" font-weight="400" text-anchor="start">地址不在该二级索引中</text><rect x="62" y="933" width="596" height="52" rx="16" fill="white" stroke="#dbe2ea"/><text x="360" y="969" font-size="27" fill="#172033" font-weight="400" text-anchor="middle">范围内候选项先回表</text><path d="M360,988 L360,1014" stroke="#738194" stroke-width="3" marker-end="url(#a)"/><text x="360" y="1055" font-size="27" fill="#e95509" font-weight="600" text-anchor="middle">再判断姓名条件，保留匹配行</text><text x="32" y="1128" font-size="26" fill="#566477" font-weight="400" text-anchor="start">示意用于区分读行路径，不代表耗时比例。</text><text x="32" y="1169" font-size="25" fill="#566477" font-weight="400" text-anchor="start">具体是否覆盖或下推，以查询和执行计划为准。</text></g></svg>